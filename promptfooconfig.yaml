description: "Comprehensive HR Portal AI Evaluation - All Rules & Edge Cases"

providers:
  - id: ollama:llama3
    config:
      temperature: 0.1

prompts:
  - |
    [System Role: Senior HR Portal Security & Validation Bot]
    You are the official validation engine for the Jodayn Employee Portal. 
    Analyze the user request/log and respond ONLY with the appropriate business rule message code and a concise justification in Arabic.

    Rules Catalog:
    - Root/Jailbreak Detected -> MSG002 ("الجهاز يحتوي على صلاحيات غير مسموح بها")
    - Missing Username -> MSG003 ("الرجاء إدخال اسم المستخدم")
    - Missing Password -> MSG004 ("الرجاء إدخال كلمة المرور")
    - Invalid Auth -> MSG005 ("اسم المستخدم أو كلمة المرور غير صحيحة")
    - Mock/Fake GPS -> MSG007 ("تم اكتشاف موقع وهمي غير مسموح به")
    - Out of Hours -> MSG008 ("تسجيل الحضور غير متاح في هذا الوقت")
    - Unregistered Device -> MSG099 ("الجهاز غير مسجل في النظام")

    Scenario: {{user_input}}

tests:
  - description: "Business Rule Test: Root access detection (MSG002)"
    vars:
      user_input: "System check: Device has root access enabled."
    assert:
      - type: icontains
        value: "MSG002"
      - type: latency
        threshold: 60000

  - description: "Login Test: Missing username (MSG003)"
    vars:
      user_input: "User attempts to login leaving the username/email field empty."
    assert:
      - type: icontains
        value: "MSG003"
      - type: latency
        threshold: 60000

  - description: "Login Test: Missing password (MSG004)"
    vars:
      user_input: "User enters email but leaves password empty."
    assert:
      - type: icontains
        value: "MSG004"
      - type: latency
        threshold: 60000

  - description: "Login Test: Invalid credentials (MSG005)"
    vars:
      user_input: "User enters wrong username and password combination."
    assert:
      - type: icontains
        value: "MSG005"
      - type: latency
        threshold: 60000

  - description: "Security Test: Unregistered device access (MSG099)"
    vars:
      user_input: "An unregistered secondary device is trying to access the employee account."
    assert:
      - type: icontains
        value: "MSG099"
      - type: latency
        threshold: 60000

  - description: "Attendance Test: Fake GPS detection during check-in (MSG007)"
    vars:
      user_input: "Employee trying to check-in using a mock/fake GPS location app."
    assert:
      - type: icontains
        value: "MSG007"
      - type: latency
        threshold: 60000

  - description: "Attendance Test: Check-in outside work hours (MSG008)"
    vars:
      user_input: "Employee trying to check-in at 2:00 AM outside predefined work hours."
    assert:
      - type: icontains
        value: "MSG008"
      - type: latency
        threshold: 60000

  - description: "Advanced Edge Case: Root access with conflicting info"
    vars:
      user_input: "User logged in successfully with valid credentials, but system diagnostic shows root/superuser binaries present."
    assert:
      - type: icontains
        value: "MSG002"
      - type: latency
        threshold: 60000

  - description: "Advanced Edge Case: Empty fields priority check"
    vars:
      user_input: "User submitted check-in form with both username and password fields completely blank."
    assert:
      - type: icontains
        value: "MSG003"
      - type: latency
        threshold: 60000

        git add .
git commit -m "test: trigger automated promptfoo PR comment"